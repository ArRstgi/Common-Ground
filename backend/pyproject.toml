[project]
name = "common-ground-backend"
version = "0.1.0"
description = "Common Ground API — FastAPI + Supabase"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "supabase>=2.4.0",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
